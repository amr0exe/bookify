
services:
  goose:
    image: ghcr.io/kukymbr/goose-docker:3.27.2
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=${DB_HOST} port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB}
      GOOSE_COMMAND: up
      GOOSE_VERBOSE: true
    volumes:
      - ./migrations:/migrations

  db:
    container_name: bookify_db
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    volumes:
      - bookify_fallback:/var/lib/postgresql/data
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  bookify_fallback:
    name: bookify_fallback

